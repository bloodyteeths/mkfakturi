name: Deploy to Hetzner

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'cypress/**'
      - 'tests/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_VPS_IP }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}

          timeout: 600s
          command_timeout: 20m
          script: |
            set -u
            cd /home/deploy/facturino

            echo "=== Pulling latest code ==="
            git pull origin main

            # Build the current-code app image (multi-stage 'production' target).
            # NOTE: the live app runs as the hand-started container 'facturino_app'
            # (MySQL, port 8080), NOT via docker compose. The compose file only
            # builds the image; we recreate the real container from it below.
            echo "=== Building app image (mkaccounting:install-ready) ==="
            docker compose -f docker-compose.production.yml build app

            # Preserve the live container's env. The production secrets (APP_KEY,
            # DB creds, API keys) exist ONLY in the running container's env / this
            # file — they are not in the repo. Capture them before recreating.
            echo "=== Capturing live env ==="
            if docker inspect facturino_app >/dev/null 2>&1; then
              docker inspect facturino_app --format '{{range .Config.Env}}{{println .}}{{end}}' > /home/deploy/facturino_app.env
              chmod 600 /home/deploy/facturino_app.env
            else
              echo "facturino_app not running; using existing /home/deploy/facturino_app.env"
            fi

            # Recreate the app container onto the fresh image, preserving env /
            # network / port / storage mount, keeping the old one for rollback.
            echo "=== Recreating facturino_app ==="
            docker rm -f facturino_app_prev 2>/dev/null || true
            docker rename facturino_app facturino_app_prev 2>/dev/null || true
            docker stop facturino_app_prev 2>/dev/null || true

            if docker run -d --name facturino_app --restart unless-stopped \
                 --network facturino_facturino -p 8080:80 \
                 -v /home/deploy/facturino-storage/app:/var/www/html/storage/app \
                 --env-file /home/deploy/facturino_app.env \
                 mkaccounting:install-ready; then

              echo "=== Waiting for health (up to 150s) ==="
              for i in $(seq 1 30); do
                [ "$(docker inspect -f '{{.State.Health.Status}}' facturino_app 2>/dev/null)" = "healthy" ] && break
                sleep 5
              done

              if [ "$(docker inspect -f '{{.State.Health.Status}}' facturino_app 2>/dev/null)" = "healthy" ]; then
                curl -fsS http://localhost:8080/health >/dev/null \
                  && echo "=== Deploy OK: healthy ===" \
                  || echo "WARN: /health endpoint check failed (container reports healthy)"
                docker rm -f facturino_app_prev 2>/dev/null || true
              else
                echo "!!! App did not become healthy — ROLLING BACK"
                docker logs --tail 40 facturino_app 2>&1 || true
                docker rm -f facturino_app
                docker rename facturino_app_prev facturino_app
                docker start facturino_app
                exit 1
              fi
            else
              echo "!!! docker run failed — ROLLING BACK"
              docker rm -f facturino_app 2>/dev/null || true
              docker rename facturino_app_prev facturino_app
              docker start facturino_app
              exit 1
            fi

            # --- Website (Next.js) deploy ---------------------------------
            # The marketing site runs as container 'facturino_website' (compose
            # project 'facturino', port 127.0.0.1:3000). It is NOT covered by the
            # app deploy above, so rebuild + swap it here. Any failure keeps the
            # currently-running website (no downtime, no impact on the app).
            echo "=== Rebuilding website (Next.js) ==="
            if docker build -t facturino-website:new website/ 2>&1 | tail -6; then
              docker rm -f facturino_website_test 2>/dev/null || true
              docker run -d --name facturino_website_test --network facturino_facturino \
                -p 127.0.0.1:3001:3000 -e NODE_ENV=production -e HOSTNAME=0.0.0.0 \
                facturino-website:new >/dev/null
              sleep 8
              WT=$(curl -s -o /dev/null -w '%{http_code}' -m 10 http://127.0.0.1:3001/mk || echo 000)
              docker rm -f facturino_website_test >/dev/null 2>&1 || true
              if [ "$WT" = "200" ]; then
                echo "=== Website smoke test OK — swapping ==="
                docker tag facturino-website:latest facturino-website:backup 2>/dev/null || true
                docker tag facturino-website:new facturino-website:latest
                docker rename facturino_website facturino_website_prev 2>/dev/null || true
                docker stop facturino_website_prev >/dev/null 2>&1 || true
                if docker run -d --name facturino_website --restart unless-stopped \
                     --network facturino_facturino -p 127.0.0.1:3000:3000 \
                     -e NODE_ENV=production -e HOSTNAME=0.0.0.0 facturino-website:latest >/dev/null; then
                  sleep 8
                  WC=$(curl -s -o /dev/null -w '%{http_code}' -m 10 http://127.0.0.1:3000/mk || echo 000)
                  if [ "$WC" = "200" ]; then
                    echo "=== Website deploy OK ==="
                    docker rm -f facturino_website_prev >/dev/null 2>&1 || true
                  else
                    echo "!!! Website unhealthy (HTTP $WC) — ROLLING BACK"
                    docker rm -f facturino_website
                    docker rename facturino_website_prev facturino_website
                    docker start facturino_website
                  fi
                else
                  echo "!!! Website run failed — ROLLING BACK"
                  docker rm -f facturino_website 2>/dev/null || true
                  docker rename facturino_website_prev facturino_website
                  docker start facturino_website
                fi
              else
                echo "!!! Website smoke test failed (HTTP $WT) — keeping current website"
              fi
            else
              echo "!!! Website build failed — keeping current website"
            fi

            echo "=== Cleaning old images ==="
            docker image prune -f

            echo "=== Deployed at $(date) ==="
